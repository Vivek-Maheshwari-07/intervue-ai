services:
  - type: web
    name: intervue-ai-backend
    env: python
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CORS_ORIGINS
        value: "*"
      - key: OLLAMA_TIMEOUT
        value: "3"
      # OLLAMA_BASE_URL: Set to your public remote GPU tunnel URL (e.g. ngrok / Modal)
      # If left default or unreachable, backend uses built-in deterministic fallback engine.
